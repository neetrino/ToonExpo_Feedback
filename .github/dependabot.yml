# Dependabot: keep GitHub Actions up to date without a PR per action.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

