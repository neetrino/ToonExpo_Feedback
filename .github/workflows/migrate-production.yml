# Production schema apply from the release commit.
# DIRECT_URL lives only in GitHub Secrets / the production environment.
# Do not put production URLs in a laptop .env or Vercel runtime.
# Skips when DIRECT_URL is not configured yet.

name: Production migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-migrate
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL is not configured; skipping production migrate"
            exit 0
          fi
          pnpm db:migrate:deploy
